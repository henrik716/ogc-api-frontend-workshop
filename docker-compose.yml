# Same layout as https://github.com/kartverket/ogc-api-starter.
#
# Two ways to serve the data, picked with SOURCE in workshop.ipynb:
#   gpkg    — the backend reads the GeoPackage in data/ directly (no database)
#   postgis — a local PostGIS database, loaded from the GeoPackage (the recommended
#             setup at Kartverket). The notebook turns this on by writing
#             COMPOSE_PROFILES=postgis to .env.
#
# Both images bake in config/pygeoapi-config.yml, so rebuild after changing it:
#   docker compose up -d --build
#
# Everything is reached through the frontend (port 3000): it serves the HTML pages
# and proxies every other request (?f=json, tiles, /openapi, ...) to pygeoapi. So
# pygeoapi's own links point there too — one URL for browsers, QGIS and scripts.
services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - API_BASE_URL=http://backend:5000
      - BASE_URL_PUBLIC=${PUBLIC_URL:-http://localhost:3000}
    platform: linux/amd64
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5001:5000"
    environment:
      - PYGEOAPI_URL=${PUBLIC_URL:-http://localhost:3000}
      # Used by the config in postgis mode (same names as the starter kit)
      - DB_HOST=postgis
      - DB_NAME=ogcapi
      - DB_USER=postgres
      - DB_PASSWORD=qwer1234
      # Same database, under the names Kartverket's distinct-values process reads
      - POSTGRES_HOST=postgis
      - POSTGRES_DB=ogcapi
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=qwer1234
    platform: linux/amd64
    depends_on:
      postgis:
        condition: service_healthy
        required: false # only when the postgis profile is on
    restart: unless-stopped

  postgis:
    profiles: [postgis]
    image: postgis/postgis:18-3.6-alpine
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      - POSTGRES_DB=ogcapi
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=qwer1234
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres -d ogcapi"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # One-off: loads the GeoPackage into PostGIS with ogr2ogr (run by the notebook)
  loader:
    profiles: [tools]
    image: ghcr.io/osgeo/gdal:alpine-small-3.13.3
    volumes:
      - ./data:/data:ro

volumes:
  postgres_data:
